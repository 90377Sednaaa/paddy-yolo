# Paddy-YOLO with Efficient Multi-Scale Attention (Paddy-YOLO-EMA)
# Proposed Thesis Model: 3 Detection Heads + Multi-Scale EMA Attention
#
# Innovations:
# 1. Backbone: 4 RGG blocks (RepConv + 5x5 DWConv GhostConv) replacing C2f.
# 2. Attention: EMA (Ouyang et al., ICASSP 2023) immediately prior to each of the 3 detection heads (P3, P4, P5).
# 3. Detection: 3 Heads at P3 (80x80), P4 (40x40), P5 (20x20) preserving standard 8,400 anchor balance.
# 4. Loss: Dynamic Inner-MPDIoU (DIMIoU Strategy H).
# 5. Parameters: ~3.38M training / ~3.34M deploy mode (< 3.5M ultra-lightweight budget).

nc: 16 # 16 rice pest classes (Table 4)
scale: n
scales:
  n: [0.33, 0.25, 1024]

# Paddy-YOLO backbone (with 4 RGG modules)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, RGG, [128, True]] # 2 (Backbone P2: 160x160, 32ch)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, RGG, [256, True]] # 4 (Backbone P3: 80x80, 64ch)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, RGG, [512, True]] # 6 (Backbone P4: 40x40, 128ch)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, RGG, [1024, True]] # 8 (Backbone P5: 20x20, 256ch)
  - [-1, 1, SPPF, [1024, 5]] # 9 (20x20, 256ch)

# Paddy-YOLO head with EMA Multi-Scale Attention
head:
  # Top-down feature pyramid
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10 (40x40)
  - [[-1, 6], 1, Concat, [1]] # 11: cat backbone P4
  - [-1, 3, C2f, [512]] # 12 (40x40, 128ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13 (80x80)
  - [[-1, 4], 1, Concat, [1]] # 14: cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (80x80, 64ch)
  - [-1, 1, EMA, []] # 16: P3 EMA Attention (80x80, 64ch)

  # Bottom-up feature pyramid
  - [-1, 1, Conv, [256, 3, 2]] # 17 (40x40, 64ch)
  - [[-1, 12], 1, Concat, [1]] # 18: cat with layer 12 (40x40, 128ch)
  - [-1, 3, C2f, [512]] # 19 (40x40, 128ch)
  - [-1, 1, EMA, []] # 20: P4 EMA Attention (40x40, 128ch)

  - [-1, 1, Conv, [512, 3, 2]] # 21 (20x20, 128ch)
  - [[-1, 9], 1, Concat, [1]] # 22: cat with layer 9 SPPF (20x20, 256ch)
  - [-1, 3, C2f, [1024]] # 23 (20x20, 256ch)
  - [-1, 1, EMA, []] # 24: P5 EMA Attention (20x20, 256ch)

  # 3 Detection Heads: [P3 (80x80), P4 (40x40), P5 (20x20)]
  - [[16, 20, 24], 1, Detect, [nc]] # 25: Detect(P3, P4, P5)
