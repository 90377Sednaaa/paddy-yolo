# Paddy-YOLO with the project's residual Efficient Multi-Scale Attention (EMA).
# EMA applies only to the final P3/P4/P5 detection inputs; the fusion neck
# retains the baseline routes and nearest-neighbor upsampling.
nc: 16
scale: n
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, RGG, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, RGG, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, RGG, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, RGG, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14
  - [-1, 3, C2f, [256]] # 15-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17
  - [-1, 3, C2f, [512]] # 18-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [1024]] # 21-P5/32
  - [15, 1, EMA, []] # 22: P3, 64 channels, default 8 groups
  - [18, 1, EMA, []] # 23: P4, 128 channels, default 8 groups
  - [21, 1, EMA, []] # 24: P5, 256 channels, default 8 groups
  - [[22, 23, 24], 1, Detect, [nc]] # 25: three original detection scales
