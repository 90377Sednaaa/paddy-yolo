# Paddy-YOLO Paper Hyperparameters Configuration
# Based on experimental settings described in the Paddy-YOLO research paper

task: detect
mode: train

# Training duration and batch size
epochs: 300
batch: 32
imgsz: 640

# Optimizer and learning rate parameters
optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Warmup parameters
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss gains
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation settings
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Disable mosaic for the final epochs
close_mosaic: 10
