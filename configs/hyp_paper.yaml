# Paddy-YOLO Paper Hyperparameters Configuration
# Table 6 specifies epochs, batch, imgsz, optimizer, learning rates, momentum, weight decay.
# Interpret its final-learning-rate setting as Ultralytics' lrf ratio (not absolute LR).
# Remaining settings below are explicit replication assumptions, not reported values.

task: detect
mode: train

# Training duration and batch size
epochs: 300
batch: 32
imgsz: 640

# Optimizer and learning rate parameters
optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
# Learning-rate schedule is not specified; retain the YOLOv8 linear default.
cos_lr: false
# Complete all 300 epochs rather than use Ultralytics' default early stopping.
patience: 0

# Warmup parameters
warmup_epochs: 3.0
warmup_momentum: 0.8
# AdamW-compatible warmup: do not start bias updates at 10x the reported lr0.
# The first run logged bias LR 0.0707895 in epoch 1 with the inherited 0.1 setting.
warmup_bias_lr: 0.0

# Loss gains
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation settings
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Disable mosaic for the final epochs
close_mosaic: 10
