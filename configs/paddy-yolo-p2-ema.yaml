# Enhanced Paddy-YOLO Architecture Configuration (P2-EMA)
# Thesis Contribution: Addressing Section 3.4 Limitations in Zheng et al. (2025)
#
# Enhancements vs baseline Paddy-YOLO:
# 1. P2 Micro-Object Detection Head (stride 4, 160x160) for small pests & fine structures.
# 2. EMA (Efficient Multi-Scale Attention, Ouyang et al., ICASSP 2023) across all 4 scales
#    to decouple pest foreground features from complex foliage / camouflage backgrounds.
# 3. Dynamic Inner-MPDIoU (DIMIoU Strategy H) for bounding box regression.
# 4. nc: 16 (16 rice pest classes, Table 4).

# Parameters
nc: 16 # number of classes
scale: n
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# Paddy-YOLO backbone (with 4 RGG modules)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, RGG, [128, True]] # 2 (Backbone P2: 160x160, 32ch)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, RGG, [256, True]] # 4 (Backbone P3: 80x80, 64ch)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, RGG, [512, True]] # 6 (Backbone P4: 40x40, 128ch)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, RGG, [1024, True]] # 8 (Backbone P5: 20x20, 256ch)
  - [-1, 1, SPPF, [1024, 5]] # 9 (20x20, 256ch)

# Enhanced Paddy-YOLO head (P2 4-Head Scheme + EMA Multi-Scale Attention)
head:
  # Top-down feature pyramid
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10 (40x40)
  - [[-1, 6], 1, Concat, [1]] # 11: cat backbone P4
  - [-1, 3, C2f, [512]] # 12 (40x40, 128ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13 (80x80)
  - [[-1, 4], 1, Concat, [1]] # 14: cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (80x80, 64ch)

  # P2 Micro-Head Extension (160x160)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 (160x160)
  - [[-1, 2], 1, Concat, [1]] # 17: cat backbone P2 (layer 2)
  - [-1, 3, C2f, [128]] # 18 (160x160, 32ch)
  - [-1, 1, EMA, []] # 19: P2 EMA Attention (160x160, 32ch) -> Micro Head

  # Bottom-up feature pyramid
  - [-1, 1, Conv, [128, 3, 2]] # 20 (80x80, 32ch)
  - [[-1, 15], 1, Concat, [1]] # 21: cat with top-down P3 (layer 15)
  - [-1, 3, C2f, [256]] # 22 (80x80, 64ch)
  - [-1, 1, EMA, []] # 23: P3 EMA Attention (80x80, 64ch) -> Small Head

  - [-1, 1, Conv, [256, 3, 2]] # 24 (40x40, 64ch)
  - [[-1, 12], 1, Concat, [1]] # 25: cat with top-down P4 (layer 12)
  - [-1, 3, C2f, [512]] # 26 (40x40, 128ch)
  - [-1, 1, EMA, []] # 27: P4 EMA Attention (40x40, 128ch) -> Medium Head

  - [-1, 1, Conv, [512, 3, 2]] # 28 (20x20, 128ch)
  - [[-1, 9], 1, Concat, [1]] # 29: cat with SPPF (layer 9)
  - [-1, 3, C2f, [1024]] # 30 (20x20, 256ch)
  - [-1, 1, EMA, []] # 31: P5 EMA Attention (20x20, 256ch) -> Large Head

  # Detect on 4 scales: [P2 (160x160), P3 (80x80), P4 (40x40), P5 (20x20)]
  - [[19, 23, 27, 31], 1, Detect, [nc]] # 32: Detect(P2, P3, P4, P5)
