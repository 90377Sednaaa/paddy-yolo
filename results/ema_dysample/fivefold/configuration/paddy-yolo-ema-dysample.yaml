# User-provided architecture: EMA after P3/P4/P5 RGG; DySample in both FPN paths.
# Diagram channel labels are unscaled; nano scaling matches the existing baseline.
nc: 16
scale: n
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1: P2/4
  - [-1, 3, RGG, [128, true]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3: P3/8
  - [-1, 6, RGG, [256, true]]       # 4
  - [-1, 1, EMA, [32]]              # 5: P3 EMA, channels injected by parser
  - [-1, 1, Conv, [512, 3, 2]]      # 6: P4/16
  - [-1, 6, RGG, [512, true]]       # 7
  - [-1, 1, EMA, [32]]              # 8: P4 EMA
  - [-1, 1, Conv, [1024, 3, 2]]     # 9: P5/32
  - [-1, 3, RGG, [1024, true]]      # 10
  - [-1, 1, EMA, [32]]              # 11: P5 EMA
  - [-1, 1, SPPF, [1024, 5]]       # 12

head:
  - [-1, 1, DySample, [2, lp, 4, false]] # 13: P5 -> P4, channels injected
  - [[-1, 8], 1, Concat, [1]]          # 14: fuse EMA P4
  - [-1, 3, C2f, [512]]                # 15
  - [-1, 1, DySample, [2, lp, 4, false]] # 16: P4 -> P3
  - [[-1, 5], 1, Concat, [1]]          # 17: fuse EMA P3
  - [-1, 3, C2f, [256]]                # 18: small head P3/8
  - [-1, 1, Conv, [256, 3, 2]]         # 19
  - [[-1, 15], 1, Concat, [1]]         # 20
  - [-1, 3, C2f, [512]]                # 21: medium head P4/16
  - [-1, 1, Conv, [512, 3, 2]]         # 22
  - [[-1, 12], 1, Concat, [1]]         # 23
  - [-1, 3, C2f, [1024]]               # 24: large head P5/32
  - [[18, 21, 24], 1, Detect, [nc]]     # 25
